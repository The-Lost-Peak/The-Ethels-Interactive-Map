      width:280px;
    }
    #search-input {
      width:100%;
      box-sizing:border-box;
      padding:10px 16px;
      border-radius:8px;
      border:none;
      background:#fff;
      font-family:Inter,system-ui,sans-serif;
      font-size:13px;
      font-weight:500;
      color:#1E1E1E;
      box-shadow:0 4px 16px rgba(0,0,0,.22);
      outline:none;
    }
    #search-input::placeholder { color:#aaa; font-weight:400; }
    #search-results {
      display:none;
      position:absolute;
      top:calc(100% + 4px);
      left:0; right:0;
      background:#fff;
      border-radius:8px;
      box-shadow:0 8px 24px rgba(0,0,0,.18);
      overflow:hidden;
      max-height:280px;
      overflow-y:auto;
    }
    #search-results.visible { display:block; }
    .search-item {
      padding:9px 16px;
      font-family:Inter,system-ui,sans-serif;
      font-size:12px;
      font-weight:500;
      color:#1E1E1E;
      cursor:pointer;
      border-bottom:1px solid #f0f0f0;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .search-item:last-child { border-bottom:none; }
    .search-item:hover { background:#f7f7f7; }
    .search-item-height { color:#EC2629; font-weight:700; font-size:11px; }
    .search-no-results {
      padding:10px 16px;
      font-family:Inter,system-ui,sans-serif;
      font-size:12px;
      color:#888;
    }

    /* ===== MARKERS ===== */
    .marker { cursor:pointer !important }
    .marker svg { transform:scale(0.85); transform-origin:center }

    /* ===== POPUPS — exact template match ===== */
    .mapboxgl-popup { filter:drop-shadow(0 14px 28px rgba(0,0,0,.45)); }
    .mapboxgl-popup-tip { display:none !important; }
    .mapboxgl-popup-content {
      background:transparent !important;
      border:none !important;
      padding:0 !important;
      box-shadow:none !important;
      width:auto !important;
      overflow:visible !important;
      display:block;
      box-sizing:border-box;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif !important;
      text-transform:capitalize;
    }

    .popup-card {
      display:flex;
      align-items:stretch;
      background:#fff;
      border-radius:12px;
      overflow:hidden;
      width:fit-content;
      height:130px;
      position:relative;
    }
    .img-wrap {
      width:140px; flex:0 0 140px; height:100%;
      border-radius:12px 0 0 12px;
      overflow:hidden; background:#000;
    }
    .img-wrap img { width:100%; height:100%; object-fit:cover; display:block }

    .popup-body {
      box-sizing:border-box;
      padding:8px 12px 10px 10px;
      flex:0 0 140px;
      min-width:140px; max-width:140px;
      text-align:center;
      display:flex; flex-direction:column;
      justify-content:center;
      line-height:1.2;
      transform:translateY(-1px);
    }

    .popup-heading { font-weight:800; font-size:11px; margin:2px 0 6px 0; color:#1E1E1E }
    .specs { font-size:10px; display:flex; flex-direction:column; gap:3px; align-items:center; margin-top:2px; transform:translateY(1px); }
    .stats-group { display:flex; flex-direction:column; gap:3px; align-items:center; transform:translateY(-2px); }
    .links-group { display:flex; flex-direction:column; gap:3px; align-items:center; }
    .spec-row { display:flex; align-items:center; justify-content:center; gap:4px }

    .icon { width:16px; height:16px }
    .icon-red { color:#EC2629 }
    .icon-blue { color:#3899EC }

    .spec-value { font-weight:800; color:#EC2629; font-size:11px }
    .spec-label { font-weight:600; color:#555; font-size:10px }
    .popup-link { color:#3899EC; font-weight:800; font-size:11px; text-decoration:none }
    .popup-link:hover { text-decoration:underline }
    .hike-gap { margin-top:2px }

    .close-btn {
      position:absolute;
      top:6px; right:6px;
      background:rgba(0,0,0,.5);
      border:none; border-radius:50%;
      width:20px; height:20px;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:11px; line-height:1;
      z-index:2; padding:0;
    }
    .close-btn:hover { background:rgba(0,0,0,.75); }

    .private-badge {
      margin-top:3px;
      display:inline-block;
      background:#fff3cd;
      color:#856404;
      font-size:9px;
      font-weight:700;
      padding:1px 5px;
      border-radius:3px;
      letter-spacing:0.3px;
      text-transform:uppercase;
    }

      .popup-card{ height:115px !important }
      .img-wrap{ width:105px !important; flex-basis:105px !important; height:115px !important }
      .popup-body{
        flex:0 0 105px !important;
        min-width:105px !important; max-width:105px !important;

      .popup-heading{ font-size:9.5px !important }
      .specs{ font-size:8.5px !important }
      .spec-value{ font-size:9.5px !important }
      .popup-link{ font-size:10px !important }
      .icon{ width:11px !important; height:11px !important }
    }

    /* ===== REMOVE TAP HIGHLIGHTS — exact template match ===== */
    .popup-link,
    .popup-link:focus,
    .popup-link:active,

      background:transparent !important;
      outline:none !important;
      border:none !important;
      box-shadow:none !important;
    }
    .popup-link, .popup-link * {

      -webkit-touch-callout:none !important;
      -webkit-user-select:none !important;
    }

    .mapboxgl-ctrl-bottom-right .mapboxgl-ctrl-attrib { order:2; }
    .mapboxgl-ctrl-attrib { transform:translate(-1px,3px); }

      z-index:5;
      letter-spacing:0.3px;
      pointer-events:none;
    }
    #ethel-counter span { color:#EC2629; }

    "googleMaps": "https://www.google.com/maps?q=53.362373,-1.720964",
    "image": "https://raw.githubusercontent.com/The-Lost-Peak/The-Ethels-Interactive-Map/main/Images/Win Hill.png",
    "gpx": "https://raw.githubusercontent.com/The-Lost-Peak/The-Ethels-Interactive-Map/main/GPX/Win Hill.gpx",
    "notes": ""
  },
  {
    "id": "95",
    "name": "Wolfscote Hill",
    "height": "388",
    "lat": 53.121944,
    "lng": -1.79667,
    "gridRef": "SK137583",
    "osMap": "OL24: White Peak",
    "googleMaps": "https://www.google.com/maps?q=53.121944,-1.79667",
    "image": "https://raw.githubusercontent.com/The-Lost-Peak/The-Ethels-Interactive-Map/main/Images/Wolfscote Hill.jpg",
    "gpx": "https://raw.githubusercontent.com/The-Lost-Peak/The-Ethels-Interactive-Map/main/GPX/Wolfscote Hill.gpx",
    "notes": ""
  }
];

const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/satellite-streets-v12",
  center: [-1.82, 53.30],
  zoom: 9,
  attributionControl: false
});

map.addControl(new mapboxgl.NavigationControl({ showCompass:true, showZoom:true }), "bottom-right");
map.addControl(new mapboxgl.FullscreenControl(), "bottom-right");
map.addControl(new mapboxgl.AttributionControl({ compact:true }), "bottom-right");

const isMobile = window.innerWidth <= 768 || ('ontouchstart' in window);

const markerEls = {};
const lockedPopups = {};
const routeLayers = {};
const routeAnims = {};
let lockedId = null;
let hoverPopupObj = null;

function setMarkerColor(id, color) {
  const el = markerEls[id];
  if (!el) return;
  const path = el.querySelector("path");
  if (path) path.setAttribute("fill", color);
}

async function loadGpx(url) {
  const res = await fetch(url);
  const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
  const gj = toGeoJSON.gpx(xml);
  return gj.features.find(f => f.geometry?.type === "LineString") || null;
}

function addRoute(ethel, lineFeature) {
  const id = ethel.id;
  const coords = lineFeature.geometry.coordinates;
  let dists = [0];
  for (let i = 1; i < coords.length; i++) {
    const dx = coords[i][0]-coords[i-1][0], dy = coords[i][1]-coords[i-1][1];
    dists.push(dists[i-1] + Math.sqrt(dx*dx+dy*dy));
  }
  const total = dists[dists.length-1];
  const srcBase=`rb-${id}`, srcAnim=`ra-${id}`, lyrBase=`rl-${id}`, lyrAnim=`la-${id}`;
  map.addSource(srcBase, { type:"geojson", data:lineFeature });
  map.addLayer({ id:lyrBase, type:"line", source:srcBase, paint:{ "line-color":RED, "line-width":3.5, "line-opacity":0 }});
  map.addSource(srcAnim, { type:"geojson", data:{ type:"Feature", geometry:{ type:"LineString", coordinates:[] }}});
  map.addLayer({ id:lyrAnim, type:"line", source:srcAnim, paint:{ "line-color":BLUE, "line-width":3.5, "line-opacity":0 }});
  routeLayers[id] = { srcBase, srcAnim, lyrBase, lyrAnim, coords, dists, total };
}

function showRoute(id) {
  const r = routeLayers[id]; if (!r) return;
  map.setPaintProperty(r.lyrBase, "line-opacity", 0.85);
  map.setPaintProperty(r.lyrAnim, "line-opacity", 1);
  startAnim(id);
}

function hideRoute(id) {
  const r = routeLayers[id]; if (!r) return;
  stopAnim(id);
  map.setPaintProperty(r.lyrBase, "line-opacity", 0);
  map.setPaintProperty(r.lyrAnim, "line-opacity", 0);
}

function startAnim(id) {
  stopAnim(id);
  const r = routeLayers[id]; if (!r) return;
  const DURATION = 5500;
  let t0 = null;
  function frame(ts) {
    if (!routeAnims[id]?.active) return;
    if (!t0) t0 = ts;
    const prog = ((ts-t0) % DURATION) / DURATION;
    const dist = prog * r.total;
    const pts = [];
    for (let i = 0; i < r.coords.length; i++) {
      if (r.dists[i] <= dist) { pts.push(r.coords[i]); }
      else {
        if (pts.length > 0 && i > 0) {
          const seg = r.dists[i]-r.dists[i-1];
          const t = seg > 0 ? (dist-r.dists[i-1])/seg : 0;
          const p=r.coords[i-1], q=r.coords[i];
          pts.push([p[0]+t*(q[0]-p[0]), p[1]+t*(q[1]-p[1])]);
        }
        break;
      }
    }
    if (pts.length >= 2) {
      const src = map.getSource(r.srcAnim);
      if (src) src.setData({ type:"Feature", geometry:{ type:"LineString", coordinates:pts }});
    }
    routeAnims[id].raf = requestAnimationFrame(frame);
  }
  routeAnims[id] = { active:true, raf:requestAnimationFrame(frame) };
}

function stopAnim(id) {
  if (routeAnims[id]) {
    routeAnims[id].active = false;
    cancelAnimationFrame(routeAnims[id].raf);
    delete routeAnims[id];
  }
  const r = routeLayers[id];
  if (r) { const src = map.getSource(r.srcAnim); if (src) src.setData({ type:"Feature", geometry:{ type:"LineString", coordinates:[] }}); }
}

const icons = {
  height: `<svg class="icon icon-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18"/><path d="M6 18l4-5 4 3 5-8"/></svg>`,
  grid:   `<svg class="icon icon-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s-8-5.5-8-11.5a8 8 0 0 1 16 0C20 16.5 12 22 12 22z"/><circle cx="12" cy="10.5" r="2.5"/></svg>`,
  map:    `<svg class="icon icon-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
  dir:    `<svg class="icon icon-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s-8-5.5-8-11.5a8 8 0 0 1 16 0C20 16.5 12 22 12 22z"/><circle cx="12" cy="10.5" r="2.5"/></svg>`
};

function buildPopupHtml(e, locked) {
  const closeBtn = locked ? `<button class="close-btn" onclick="closeLocked(event)" title="Close">&#x2715;</button>` : "";
  const badge = e.notes === "On Private Land" ? `<div class="private-badge">Private Land</div>` : "";
  return `
<div class="popup-card">
  ${closeBtn}
  <div class="img-wrap"><img src="${e.image}" alt="${e.name}" loading="lazy" /></div>
  <div class="popup-body">
    <div class="popup-heading">${e.name}</div>
    <div class="specs">
      <div class="stats-group">
        <div class="spec-row">${icons.height}<span class="spec-value">${e.height}m</span></div>
        <div class="spec-row">${icons.grid}<span class="spec-value">${e.gridRef}</span></div>
        <div class="spec-row">${icons.map}<span class="spec-value">${e.osMap}</span></div>
      </div>
      <div class="links-group">
        <div class="spec-row hike-gap">${icons.dir}<a class="popup-link" href="${e.googleMaps}" target="_blank" rel="noopener">Directions</a></div>
      </div>
    </div>
    ${badge}
  </div>
</div>`;
}

window.closeLocked = function(evt) {
  if (evt) evt.stopPropagation();
  if (lockedId !== null) {
    hideRoute(lockedId);
    if (lockedPopups[lockedId]) { lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
    setMarkerColor(lockedId, RED);
    lockedId = null;
  }
};

function showHoverPopup(e) {
  if (hoverPopupObj) { hoverPopupObj.remove(); hoverPopupObj = null; }
  setMarkerColor(e.id, BLUE);
  showRoute(e.id);
  hoverPopupObj = new mapboxgl.Popup({ offset:22, closeButton:false, closeOnClick:false, anchor:"bottom" })
    .setLngLat([e.lng, e.lat]).setHTML(buildPopupHtml(e, false)).addTo(map);
}

function hideHoverPopup(id) {
  if (lockedId === id) return;
  if (hoverPopupObj) { hoverPopupObj.remove(); hoverPopupObj = null; }
  hideRoute(id);
  setMarkerColor(id, RED);
}

function lockEthel(e) {
  if (hoverPopupObj) { hoverPopupObj.remove(); hoverPopupObj = null; }
  if (lockedId !== null && lockedId !== e.id) {
    hideRoute(lockedId);
    if (lockedPopups[lockedId]) { lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
    setMarkerColor(lockedId, RED);
  }
  if (lockedId === e.id) { closeLocked(); return; }
  lockedId = e.id;
  setMarkerColor(e.id, BLUE);
  showRoute(e.id);
  const p = new mapboxgl.Popup({ offset:22, closeButton:false, closeOnClick:false, anchor:"bottom" })
    .setLngLat([e.lng, e.lat]).setHTML(buildPopupHtml(e, true)).addTo(map);
  lockedPopups[e.id] = p;
}

map.on("load", async () => {
  const bounds = new mapboxgl.LngLatBounds();
  ETHELS.forEach(e => {
    bounds.extend([e.lng, e.lat]);
    const el = document.createElement("div");
    el.className = "marker";
    el.innerHTML = `<svg width="27" height="41" viewBox="0 0 27 41" xmlns="http://www.w3.org/2000/svg">
      <path d="M13.5 0C6.044 0 0 6.044 0 13.5c0 9.375 13.5 27.5 13.5 27.5S27 22.875 27 13.5C27 6.044 20.956 0 13.5 0z" fill="${RED}"/>
      <circle cx="13.5" cy="13.5" r="5" fill="white" opacity="0.9"/>
    </svg>`;
    markerEls[e.id] = el;
    new mapboxgl.Marker({ element:el }).setLngLat([e.lng, e.lat]).addTo(map);

    if (!isMobile) {
      el.addEventListener("mouseenter", () => { if (lockedId !== e.id) showHoverPopup(e); });
      el.addEventListener("mouseleave", () => { if (lockedId !== e.id) hideHoverPopup(e.id); });
      el.addEventListener("click", evt => { evt.stopPropagation(); lockEthel(e); });
    } else {
      el.addEventListener("click", evt => { evt.stopPropagation(); lockEthel(e); });
    }
  });

  map.on("click", () => { if (!isMobile) closeLocked(); });
  const mob = window.innerWidth < 600;
  map.fitBounds(bounds, { padding: mob ? 30 : 80, maxZoom:11 });

  for (const e of ETHELS) {
    try { const line = await loadGpx(e.gpx); if (line) addRoute(e, line); } catch (_) {}
  }
});

const searchInput = document.getElementById("search-input");
const searchResults = document.getElementById("search-results");

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { searchResults.classList.remove("visible"); return; }
  const hits = ETHELS.filter(e => e.name.toLowerCase().includes(q)).slice(0, 9);
  if (!hits.length) {
    searchResults.innerHTML = `<div class="search-no-results">No results for "${q}"</div>`;
    searchResults.classList.add("visible"); return;
  }
  searchResults.innerHTML = hits.map(e =>
    `<div class="search-item" data-id="${e.id}"><span>${e.name}</span><span class="search-item-height">${e.height}m</span></div>`
  ).join("");
  searchResults.classList.add("visible");
});

searchResults.addEventListener("click", evt => {
  const item = evt.target.closest(".search-item"); if (!item) return;
  const e = ETHELS.find(x => x.id === item.dataset.id); if (!e) return;
  searchInput.value = ""; searchResults.classList.remove("visible");
  map.flyTo({ center:[e.lng, e.lat], zoom:14, duration:1000 });
  setTimeout(() => lockEthel(e), 1050);
});

document.addEventListener("click", e => { if (!e.target.closest("#search-container")) searchResults.classList.remove("visible"); });
searchInput.addEventListener("keydown", e => {
  if (e.key === "Escape") { searchResults.classList.remove("visible"); searchInput.blur(); }
  if (e.key === "Enter") { const first = searchResults.querySelector(".search-item"); if (first) first.click(); }
});
</script>
</body>
