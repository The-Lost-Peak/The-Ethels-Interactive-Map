
<!DOCTYPE html>
<html>
<head>
  <!-- ... (existing head content) ... -->
  <script src="https://static.parastorage.com/services/js-sdk/1.98.0/js/wix.min.js"></script>
  <script>
    // Initialize Wix SDK
    wixSdk = wix.getSdk();

    // Function to get current logged in user 
    async function getCurrentUser() {
      try {
        const user = await wixSdk.currentMember.getMember();
        return user;
      } catch (error) {
        console.error("Failed to get current user:", error);
      }
    }

    // Function to get user's completed Ethels
    async function getCompletedEthels(userId) {
      try {
        const completedEthels = await wixSdk.data.query("UserProgress")
          .eq("userId", userId)
          .eq("isCompleted", true)
          .descending("completedDate")
          .find();
        return completedEthels;
      } catch (error) {
        console.error("Failed to get completed Ethels:", error);
      }
    }
    
    // Function to mark an Ethel as completed
    async function markEthelCompleted(userId, ethelId) {
      try {
        await wixSdk.data.insert("UserProgress", {
          userId: userId,
          ethelId: ethelId, 
          isCompleted: true,
          completedDate: new Date()
        });
      } catch (error) {
        console.error("Failed to mark Ethel completed:", error);  
      }
    }

    // Function to mark an Ethel as incomplete
    async function markEthelIncomplete(userId, ethelId) {
      try {
        await wixSdk.data.remove("UserProgress", {
          userId: userId,
          ethelId: ethelId
        });
      } catch (error) {
        console.error("Failed to mark Ethel incomplete:", error);
      }
    }

    // Function to check if an Ethel is completed  
    async function isEthelCompleted(userId, ethelId) {
      try {
        const record = await wixSdk.data.query("UserProgress")
          .eq("userId", userId)
          .eq("ethelId", ethelId)
          .eq("isCompleted", true)
          .limit(1)
          .find();
        return record.items.length > 0;
      } catch (error) {
        console.error("Failed to check Ethel completion:", error);
      }
    }

    // Function to get user's badges
    async function getUserBadges(userId) {
      try {
        const badges = await wixSdk.data.query("Badges")
          .eq("userId", userId)
          .descending("earnedDate")  
          .find();
        return badges;
      } catch (error) {
        console.error("Failed to get user badges:", error);
      }
    }

    // Function to award a badge
    async function awardBadge(userId, badgeId, badgeName, badgeImage) {
      try {
        await wixSdk.data.insert("Badges", {
          userId: userId,
          badgeId: badgeId,
          badgeName: badgeName, 
          badgeImage: badgeImage,
          earnedDate: new Date()
        });
      } catch (error) {
        console.error("Failed to award badge:", error);
      } 
    }

    // Event handler for completion checkbox
    async function handleCompletionCheckbox(event) {
      const ethelId = event.target.dataset.ethelId;
      const userId = await getCurrentUser().id;
      
      if (event.target.checked) {
        await markEthelCompleted(userId, ethelId);
      } else {
        await markEthelIncomplete(userId, ethelId);
      }
      
      updateMapMarkers();
    }

    // Function to update map markers based on completion status
    async function updateMapMarkers() {
      const userId = await getCurrentUser().id;
      const completedEthels = await getCompletedEthels(userId);
      
      // Assuming you have a function to get all Ethel markers
      const markers = getAllMarkers(); 
      
      markers.forEach(marker => {
        const isCompleted = completedEthels.some(ethel => ethel.ethelId === marker.ethelId);
        
        if (isCompleted) {
          marker.setIcon('completed-icon.png');
        } else {
          marker.setIcon('incomplete-icon.png');  
        }
      });
    }

    // Function to initialize the completion checkboxes
    async function initCompletionCheckboxes() {
      const checkboxes = document.querySelectorAll('.completion-checkbox');
      const userId = await getCurrentUser().id;
      
      checkboxes.forEach(async checkbox => {
        const ethelId = checkbox.dataset.ethelId;
        const isCompleted = await isEthelCompleted(userId, ethelId);
        checkbox.checked = isCompleted;
        checkbox.addEventListener('change', handleCompletionCheckbox);
      });
    }

    // Function to initialize the account page
    async function initAccountPage() {
      const userId = await getCurrentUser().id;
      const completedEthels = await getCompletedEthels(userId);
      const badges = await getUserBadges(userId);

      // Render the completed Ethels list
      const completedEthelsList = document.getElementById('completed-ethels-list');
      completedEthels.forEach(ethel => {
        const listItem = document.createElement('li');
        listItem.textContent = `${ethel.ethelName} - ${ethel.completedDate}`;
        completedEthelsList.appendChild(listItem);
      });

      // Render the badges
      const badgesList = document.getElementById('badges-list');
      badges.forEach(badge => {
        const listItem = document.createElement('li');
        const badgeImage = document.createElement('img');
        badgeImage.src = badge.badgeImage;
        badgeImage.alt = badge.badgeName;
        listItem.appendChild(badgeImage);
        badgesList.appendChild(listItem);
      });
      
      // Render the progress bar
      const progressBar = document.getElementById('progress-bar');
      const totalEthels = 95; // Assuming there are 95 Ethels in total
      const completedCount = completedEthels.length;
      const progress = (completedCount / totalEthels) * 100;
      progressBar.style.width = `${progress}%`;
      progressBar.textContent = `${completedCount} / ${totalEthels}`;
    }

    // Initialize the app when the page loads
    document.addEventListener('DOMContentLoaded', async function() {
      await initCompletionCheckboxes();
      await initAccountPage();
      await updateMapMarkers();
    });
  </script>
</head>

</html>
