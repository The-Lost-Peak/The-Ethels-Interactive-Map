const map = new mapboxgl.Map({
  container:"map", style:"mapbox://styles/mapbox/satellite-streets-v12",
  center:[-1.82,53.30], zoom:9, attributionControl:false
});
map.addControl(new mapboxgl.NavigationControl({showCompass:true,showZoom:true}),"bottom-right");

map.addControl(new mapboxgl.AttributionControl({compact:true}),"bottom-right");

const isMobile = window.innerWidth<=768||('ontouchstart' in window);
const markerEls={}, lockedPopups={}, routeLayers={}, routeAnims={};
let lockedId=null, hoverPopupObj=null;

function setMarkerColor(id,color){
  const el=markerEls[id]; if(!el) return;
  const path=el.querySelector("path"); if(path) path.setAttribute("fill",color);
}

async function loadGpx(url){
  const res=await fetch(url);
  const xml=new DOMParser().parseFromString(await res.text(),"text/xml");
  const gj=toGeoJSON.gpx(xml);
  return gj.features.find(f=>f.geometry?.type==="LineString")||null;
}

function addRoute(ethel,lineFeature){
  const id=ethel.id, coords=lineFeature.geometry.coordinates;
  let dists=[0];
  for(let i=1;i<coords.length;i++){
    const dx=coords[i][0]-coords[i-1][0],dy=coords[i][1]-coords[i-1][1];
    dists.push(dists[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  const total=dists[dists.length-1];
  const srcBase=`rb-${id}`,srcAnim=`ra-${id}`,lyrBase=`rl-${id}`,lyrAnim=`la-${id}`;
  map.addSource(srcBase,{type:"geojson",data:lineFeature});
  map.addLayer({id:lyrBase,type:"line",source:srcBase,paint:{"line-color":RED,"line-width":3.5,"line-opacity":0}});
  map.addSource(srcAnim,{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:[]}}});
  map.addLayer({id:lyrAnim,type:"line",source:srcAnim,paint:{"line-color":BLUE,"line-width":3.5,"line-opacity":0}});
  routeLayers[id]={srcBase,srcAnim,lyrBase,lyrAnim,coords,dists,total};
}

function showRoute(id){
  const r=routeLayers[id]; if(!r) return;
  map.setPaintProperty(r.lyrBase,"line-opacity",0.85);
  map.setPaintProperty(r.lyrAnim,"line-opacity",1);
  startAnim(id);
}
function hideRoute(id){
  const r=routeLayers[id]; if(!r) return;
  stopAnim(id);
  map.setPaintProperty(r.lyrBase,"line-opacity",0);
  map.setPaintProperty(r.lyrAnim,"line-opacity",0);
}
function startAnim(id){
  stopAnim(id);
  const r=routeLayers[id]; if(!r) return;
  const DUR=5500; let t0=null;
  function frame(ts){
    if(!routeAnims[id]?.active) return;
    if(!t0) t0=ts;
    const prog=((ts-t0)%DUR)/DUR, dist=prog*r.total, pts=[];
    for(let i=0;i<r.coords.length;i++){
      if(r.dists[i]<=dist){ pts.push(r.coords[i]); }
      else{
        if(pts.length>0&&i>0){
          const seg=r.dists[i]-r.dists[i-1],t=seg>0?(dist-r.dists[i-1])/seg:0;
          const p=r.coords[i-1],q=r.coords[i];
          pts.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])]);
        }
        break;
      }
    }
    if(pts.length>=2){ const src=map.getSource(r.srcAnim); if(src) src.setData({type:"Feature",geometry:{type:"LineString",coordinates:pts}}); }
    routeAnims[id].raf=requestAnimationFrame(frame);
  }
  routeAnims[id]={active:true,raf:requestAnimationFrame(frame)};
}
function stopAnim(id){
  if(routeAnims[id]){ routeAnims[id].active=false; cancelAnimationFrame(routeAnims[id].raf); delete routeAnims[id]; }
  const r=routeLayers[id];
  if(r){ const src=map.getSource(r.srcAnim); if(src) src.setData({type:"Feature",geometry:{type:"LineString",coordinates:[]}}); }
}

function buildPopupHtml(e, locked){
  const closeBtn = locked ? `<button class="close-btn" onclick="closeLocked(event)">&#x2715;</button>` : "";
  const badge = e.notes ? `<div class="private-badge">${e.notes}</div>` : "";
  const osLink = e.osMapsUrl ? `<div class="spec-row">${icons.trail}<a class="popup-link" href="${e.osMapsUrl}" target="_blank" rel="noopener">OS Maps</a></div>` : "";
  const atLink = e.allTrailsUrl ? `<div class="spec-row">${icons.trail}<a class="popup-link" href="${e.allTrailsUrl}" target="_blank" rel="noopener">AllTrails</a></div>` : "";
  const kmLink = e.komootUrl ? `<div class="spec-row">${icons.trail}<a class="popup-link" href="${e.komootUrl}" target="_blank" rel="noopener">Komoot</a></div>` : "";
  const buyLink = e.osAffiliateUrl ? `<div class="spec-row">${icons.buy}<a class="popup-link" href="${e.osAffiliateUrl}" target="_blank" rel="noopener">Buy Map</a></div>` : "";
  const dirLink = `<div class="spec-row">${icons.dir}<a class="popup-link" href="${e.googleMaps}" target="_blank" rel="noopener">Directions</a></div>`;
  return `
<div class="popup-card">
  ${closeBtn}
  <div class="img-wrap"><img src="${e.image}" alt="${e.name}" loading="lazy" /></div>
  <div class="popup-body">
    <div class="popup-heading">${e.name}</div>
    <div class="specs">
      <div class="stats-group">
        <div class="spec-row">${icons.height}<span class="spec-value">${e.height}m</span></div>
        <div class="spec-row">${icons.grid}<span class="spec-value">${e.gridRef}</span></div>
        <div class="spec-row">${icons.osmap}<span class="spec-value">${e.osMap}</span></div>
      </div>
      <div class="links-group">
        ${dirLink}${osLink}${atLink}${kmLink}${buyLink}
      </div>
    </div>
    ${badge}
  </div>
</div>`;
}

window.closeLocked = function(evt){
  if(evt) evt.stopPropagation();
  if(lockedId!==null){
    hideRoute(lockedId);
    if(lockedPopups[lockedId]){ lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
    setMarkerColor(lockedId,RED); lockedId=null;
  }
};

function showHoverPopup(e){
  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
  setMarkerColor(e.id,BLUE); showRoute(e.id);
  hoverPopupObj=new mapboxgl.Popup({offset:22,closeButton:false,closeOnClick:false,anchor:"bottom"})
    .setLngLat([e.lng,e.lat]).setHTML(buildPopupHtml(e,false)).addTo(map);
}
function hideHoverPopup(id){
  if(lockedId===id) return;
  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
  hideRoute(id); setMarkerColor(id,RED);
}
function lockEthel(e){
  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
  if(lockedId!==null&&lockedId!==e.id){
    hideRoute(lockedId);
    if(lockedPopups[lockedId]){ lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
    setMarkerColor(lockedId,RED);
  }
  if(lockedId===e.id){ closeLocked(); return; }
  lockedId=e.id; setMarkerColor(e.id,BLUE); showRoute(e.id);
  const p=new mapboxgl.Popup({offset:22,closeButton:false,closeOnClick:false,anchor:"bottom"})
    .setLngLat([e.lng,e.lat]).setHTML(buildPopupHtml(e,true)).addTo(map);
  lockedPopups[e.id]=p;
}

map.on("load", async ()=>{
  const bounds=new mapboxgl.LngLatBounds();
  ETHELS.forEach(e=>{
    bounds.extend([e.lng,e.lat]);
    const el=document.createElement("div");
    el.className="marker";
    el.innerHTML=`<svg width="27" height="41" viewBox="0 0 27 41" xmlns="http://www.w3.org/2000/svg">
      <path d="M13.5 0C6.044 0 0 6.044 0 13.5c0 9.375 13.5 27.5 13.5 27.5S27 22.875 27 13.5C27 6.044 20.956 0 13.5 0z" fill="${RED}"/>
      <circle cx="13.5" cy="13.5" r="5" fill="white" opacity="0.9"/>
    </svg>`;
    markerEls[e.id]=el;
    new mapboxgl.Marker({element:el}).setLngLat([e.lng,e.lat]).addTo(map);
    if(!isMobile){
      el.addEventListener("mouseenter",()=>{ if(lockedId!==e.id) showHoverPopup(e); });
      el.addEventListener("mouseleave",()=>{ if(lockedId!==e.id) hideHoverPopup(e.id); });
      el.addEventListener("click",evt=>{ evt.stopPropagation(); lockEthel(e); });
    } else {
      el.addEventListener("click",evt=>{ evt.stopPropagation(); lockEthel(e); });
    }
  });
  map.on("click",()=>{ if(!isMobile) closeLocked(); });
  const mob=window.innerWidth<600;
  map.fitBounds(bounds,{padding:mob?30:80,maxZoom:11});
  for(const e of ETHELS){
    try{ const line=await loadGpx(e.gpx); if(line) addRoute(e,line); }catch(_){}
  }
});

const searchInput=document.getElementById("search-input");
const searchResults=document.getElementById("search-results");
searchInput.addEventListener("input",()=>{
  const q=searchInput.value.trim().toLowerCase();
  if(!q){ searchResults.classList.remove("visible"); return; }
  const hits=ETHELS.filter(e=>e.name.toLowerCase().includes(q)).slice(0,9);
  if(!hits.length){ searchResults.innerHTML=`<div class="search-no-results">No results for "${q}"</div>`; searchResults.classList.add("visible"); return; }
  searchResults.innerHTML=hits.map(e=>`<div class="search-item" data-id="${e.id}"><span>${e.name}</span><span class="search-item-height">${e.height}m</span></div>`).join("");
  searchResults.classList.add("visible");
});
searchResults.addEventListener("click",evt=>{
  const item=evt.target.closest(".search-item"); if(!item) return;
  const e=ETHELS.find(x=>x.id===item.dataset.id); if(!e) return;
  searchInput.value=""; searchResults.classList.remove("visible");
  map.flyTo({center:[e.lng,e.lat],zoom:14,duration:1000});
  setTimeout(()=>lockEthel(e),1050);
});
document.addEventListener("click",e=>{ if(!e.target.closest("#search-container")) searchResults.classList.remove("visible"); });
searchInput.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ searchResults.classList.remove("visible"); searchInput.blur(); }
  if(e.key==="Enter"){ const first=searchResults.querySelector(".search-item"); if(first) first.click(); }
});
