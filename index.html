<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The 95 Ethels | The Lost Peak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin:0; height:100% }
    #map { position:absolute; inset:0 }

    #search-container {
      position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:10; width:280px;
    }
    #search-input {
      width:100%; box-sizing:border-box; padding:10px 16px; border-radius:8px; border:none;
      background:#fff; font-family:Inter,system-ui,sans-serif; font-size:13px; font-weight:500;
      color:#1E1E1E; box-shadow:0 4px 16px rgba(0,0,0,.22); outline:none;
    }
    #search-input::placeholder { color:#aaa; font-weight:400; }
    #search-results {
      display:none; position:absolute; top:calc(100% + 4px); left:0; right:0;
      background:#fff; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.18);
      overflow:hidden; max-height:280px; overflow-y:auto;
    }
    #search-results.visible { display:block; }
    .search-item {
      padding:9px 16px; font-family:Inter,system-ui,sans-serif; font-size:12px; font-weight:500;
      color:#1E1E1E; cursor:pointer; border-bottom:1px solid #f0f0f0;
      display:flex; align-items:center; justify-content:space-between;
    }
    .search-item:last-child { border-bottom:none; }
    .search-item:hover { background:#f7f7f7; }
    .search-item-height { color:#EC2629; font-weight:700; font-size:11px; }
    .search-no-results { padding:10px 16px; font-family:Inter,system-ui,sans-serif; font-size:12px; color:#888; }

    .marker { cursor:pointer !important }
    .marker svg { transform:scale(0.72); transform-origin:center }

    .mapboxgl-popup { filter:drop-shadow(0 14px 28px rgba(0,0,0,.45)); }
    .mapboxgl-popup-tip { display:none !important; }
    .mapboxgl-popup-content {
      background:transparent !important; border:none !important; padding:0 !important;
      box-shadow:none !important; width:auto !important; overflow:visible !important;
      display:block; box-sizing:border-box;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif !important;
      text-transform:capitalize;
    }

    .popup-card {
      display:flex; align-items:stretch; background:#fff; border-radius:12px;
      overflow:hidden; width:fit-content; height:185px; position:relative; gap:0;
    }
    .img-wrap {
      width:150px; flex:0 0 150px; height:185px;
      border-radius:12px 0 0 12px; overflow:hidden; background:#000;
      display:block; line-height:0; flex-shrink:0; margin-right:-1px;
    }
    .img-wrap img { width:100%; height:100%; object-fit:cover; display:block; border:none; outline:none; }

    .popup-body {
      box-sizing:border-box; padding:2px 10px 2px 10px;
      flex:0 0 165px; min-width:165px; max-width:165px;
      text-align:center; display:flex; flex-direction:column;
      justify-content:center; line-height:1.2; transform:translateY(-1px);
    }

    .popup-heading { font-weight:800; font-size:12px; margin:0 0 5px 0; color:#1E1E1E; position:relative; top:2px; }
    .specs { font-size:11px; display:flex; flex-direction:column; gap:3px; align-items:center; margin-top:2px; position:relative; top:-2px; }
    .stats-group { display:flex; flex-direction:column; gap:3px; align-items:center; }
    .links-group { display:flex; flex-direction:column; gap:3px; align-items:center; margin-top:1px; width:100%; }
    .spec-row { display:flex; align-items:center; justify-content:center; gap:4px }
    .icon { width:13px; height:13px; flex-shrink:0; }
    .icon-red { color:#EC2629 }
    .icon-blue { color:#3899EC }
    .spec-value { font-weight:800; color:#EC2629; font-size:11.5px }
    .popup-link { color:#3899EC; font-weight:800; font-size:11.5px; text-decoration:none; display:flex; align-items:center; gap:3px; }
    .popup-link:hover { text-decoration:underline }
    .popup-note {
      position:absolute;
      bottom:5px; left:0; width:140px;
      text-align:center;
      font-family:Inter,system-ui,sans-serif;
      font-size:10px; font-weight:700; color:#fff;
      text-transform:none;
      display:flex; align-items:center; justify-content:center; gap:3px;
      text-shadow:0 1px 3px rgba(0,0,0,.7);
      pointer-events:none;
    }
    .popup-note svg { flex-shrink:0; }
    .close-btn {
      position:absolute; top:6px; right:6px; background:rgba(0,0,0,.5);
      border:none; border-radius:50%; width:20px; height:20px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:8px; line-height:1; z-index:2; padding:0;
      outline:none; box-shadow:none;
    }
    .close-btn:hover { background:rgba(0,0,0,.75); }
    .close-btn:focus, .close-btn:active, .close-btn:focus-visible { outline:none; box-shadow:none; border:none; }
    .eye-btn {
      position:absolute; top:6px; left:6px; background:rgba(0,0,0,.5);
      border:none; border-radius:50%; width:20px; height:20px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; z-index:2; padding:0;
      outline:none; box-shadow:none;
    }
    .eye-btn:hover { background:rgba(0,0,0,.75); }
    .eye-btn:focus, .eye-btn:active, .eye-btn:focus-visible { outline:none; box-shadow:none; border:none; }
    .fly-btn {
      position:absolute; top:6px; left:32px; background:rgba(0,0,0,.5);
      border:none; border-radius:50%; width:20px; height:20px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; z-index:2; padding:0;
    }
    .fly-btn:hover { background:rgba(0,0,0,.75); }

    /* ===== FLYOVER OVERLAY PANEL ===== */
    #flyover-overlay {
      display:none; position:absolute; inset:0; z-index:500; pointer-events:none;
    }
    #flyover-overlay.active { display:block; }
    .fv-ui {
      position:absolute; top:50%; transform:translateY(-50%);
      z-index:10; display:flex; flex-direction:column; gap:14px; pointer-events:auto;
    }
    .fv-ui-left  { left:20px; }
    .fv-ui-right { right:20px; }
    .fv-btn {
      width:50px; height:50px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      border:3px solid #fff; cursor:pointer;
      background:linear-gradient(180deg,#EC2629,#b51d20);
      box-shadow:0 3px 10px rgba(0,0,0,.35);
      transition:.15s; padding:0;
    }
    .fv-btn:hover { background:linear-gradient(180deg,#3899EC,#297fc8); }
    .fv-btn svg { fill:#fff; width:24px; height:24px; display:none; }
    .fv-btn svg.active { display:block; }
    .fv-speed-wrap { position:relative; width:50px; height:50px; }
    .fv-speed-panel {
      position:absolute; top:50%; right:60px;
      transform:translateY(-50%) scale(.98);
      opacity:0; pointer-events:none;
      width:220px; height:44px;
      display:flex; align-items:center; gap:12px; padding:0 10px;
      border-radius:9999px; border:3px solid #fff;
      background:linear-gradient(180deg,#EC2629,#b51d20);
      transition:opacity .18s,transform .18s;
      box-shadow:0 3px 10px rgba(0,0,0,.35);
    }
    .fv-speed-wrap.open .fv-speed-panel { opacity:1; transform:translateY(-50%) scale(1); pointer-events:auto; }
    .fv-speed-slider { flex:1; appearance:none; height:6px; border-radius:999px; background:linear-gradient(90deg,#fff,#fff8); outline:none; }
    .fv-speed-slider::-webkit-slider-thumb {
      appearance:none; width:18px; height:18px; border-radius:50%;
      background:#fff; border:2px solid #EC2629;
      box-shadow:0 2px 8px rgba(0,0,0,.25); cursor:pointer;
    }

    /* Return to Map pill */
    #fvBtnReturn {
      position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
      border-radius:9999px; width:auto; height:auto; padding:10px 22px;
      font-family:Inter,system-ui,sans-serif; font-size:13px; font-weight:700;
      color:#fff; letter-spacing:0.01em; white-space:nowrap; pointer-events:auto;
    }
    #fvBtnReturn svg { display:none; }

    /* Fullscreen button — shared style for both map and flyover */
    .fs-btn {
      position:absolute; bottom:50px; right:20px; z-index:10;
      width:50px; height:50px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      border:3px solid #fff; cursor:pointer;
      background:linear-gradient(180deg,#EC2629,#b51d20);
      box-shadow:0 3px 10px rgba(0,0,0,.35); transition:.15s; padding:0;
    }
    .fs-btn:hover { background:linear-gradient(180deg,#3899EC,#297fc8); }
    .fs-btn svg { fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; width:22px; height:22px; display:block; }

    /* Free cam pulse */
    .fv-btn.fv-free { background:linear-gradient(180deg,#3899EC,#297fc8) !important; animation:fv-pulse 1.4s ease-in-out infinite; }
    @keyframes fv-pulse { 0%,100%{box-shadow:0 3px 10px rgba(0,0,0,.35)} 50%{box-shadow:0 0 0 6px rgba(56,153,236,.35),0 3px 10px rgba(0,0,0,.35)} }

    @media(max-width:767px){
      .fv-btn { width:42px; height:42px; border:1.5px solid #fff; }
      .fv-btn svg { width:20px; height:20px; }
      .fv-ui { gap:10px; }
      /* Left stays left, right stays right, both vertically centred */
      .fv-ui-left { left:16px; top:50%; transform:translateY(-50%); right:auto; bottom:auto; }
      .fv-ui-right { right:16px; top:50%; transform:translateY(-50%); left:auto; bottom:auto; }
      .fv-speed-wrap { width:42px; height:42px; }
      .fv-speed-panel { height:36px; right:50px; width:185px; border:none; }
      #fvBtnReturn { bottom:16px; font-size:12px; padding:8px 18px; }
      .fs-btn { width:42px; height:42px; border:1.5px solid #fff; bottom:46px; right:16px; }
      .fs-btn svg { width:18px; height:18px; }
      /* Prevent blue tap highlight and stuck active state on mobile */
      .fv-btn, .fs-btn { -webkit-tap-highlight-color:transparent; }
      .fv-btn:active, .fs-btn:active { background:linear-gradient(180deg,#EC2629,#b51d20); }
      /* Mobile-specific icon offset: eye left 0.5px from desktop position */
      #fvIconCamFollow { transform:translate(0px,1px) !important; }
    }

    .mapboxgl-ctrl-attrib { position:absolute; bottom:6px; right:6px; }
    .marker-eye-overlay {
      display:none;
      position:absolute;
      width:0; height:0; overflow:visible;
      top:-10px; left:50%;
      transform:translateX(-50%);
      pointer-events:none;
    }
    .marker-eye-overlay > div { pointer-events:auto; cursor:pointer; }
    .marker.info-hidden .marker-eye-overlay { pointer-events:auto; }
    .marker.info-hidden .marker-eye-overlay { display:block; }

    .popup-link, .popup-link:focus, .popup-link:active, .popup-link:focus-visible {
      background:transparent !important; outline:none !important; border:none !important; box-shadow:none !important;
    }
    .popup-link, .popup-link * {
      -webkit-tap-highlight-color:transparent !important;
      -webkit-touch-callout:none !important; -webkit-user-select:none !important;
    }

    @media (max-width:440px){
      .marker svg { transform:scale(0.612) !important; }
      #search-container { width:calc(100% - 24px); top:10px; }
      .popup-card { height:179px !important }
      .img-wrap { width:105px !important; flex-basis:105px !important; height:179px !important }
      .popup-body { flex:0 0 120px !important; min-width:120px !important; max-width:120px !important; padding:4px 6px !important; }
      .popup-heading { font-size:10.5px !important }
      .specs { font-size:9.5px !important }
      .spec-value { font-size:10px !important }
      .popup-link { font-size:10px !important }
      .icon { width:11px !important; height:11px !important }
      .popup-note { width:105px !important; font-size:9px !important; }
    }

  </style>
</head>

function setMarkerColor(id,color){
  const el=markerEls[id]; if(!el) return;
  const path=el.querySelector("path"); if(path) path.setAttribute("fill",color);

async function loadGpx(url){
  const res=await fetch(url);
  const xml=new DOMParser().parseFromString(await res.text(),"text/xml");
  const gj=toGeoJSON.gpx(xml);
  return gj.features.find(f=>f.geometry?.type==="LineString")||null;
}

function addRoute(ethel,lineFeature){
  const id=ethel.id, coords=lineFeature.geometry.coordinates;
  let dists=[0];
  for(let i=1;i<coords.length;i++){
    const dx=coords[i][0]-coords[i-1][0],dy=coords[i][1]-coords[i-1][1];
    dists.push(dists[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  const total=dists[dists.length-1];
  const srcBase=`rb-${id}`,srcAnim=`ra-${id}`,lyrBase=`rl-${id}`,lyrAnim=`la-${id}`;
  map.addSource(srcBase,{type:"geojson",data:lineFeature});
  map.addLayer({id:lyrBase,type:"line",source:srcBase,paint:{"line-color":RED,"line-width":3.5,"line-opacity":0}});
  map.addSource(srcAnim,{type:"geojson",lineMetrics:true,data:{type:"Feature",geometry:{type:"LineString",coordinates:[]}}});
  map.addLayer({id:lyrAnim,type:"line",source:srcAnim,layout:{"line-cap":"round","line-join":"round"},paint:{
      "line-width":3.5,
      "line-opacity":0,
      "line-gradient":["interpolate",["linear"],["line-progress"],
        0,"#3899EC",
        1,"#FF8C00"
      ]
    }});
  routeLayers[id]={srcBase,srcAnim,lyrBase,lyrAnim,coords,dists,total};
}

function showRoute(id){
  const r=routeLayers[id]; if(!r) return;
  map.setPaintProperty(r.lyrBase,"line-opacity",0.85);
  map.setPaintProperty(r.lyrAnim,"line-opacity",1);
  startAnim(id);
}
function hideRoute(id){
  const r=routeLayers[id]; if(!r) return;
  stopAnim(id);
  map.setPaintProperty(r.lyrBase,"line-opacity",0);
  map.setPaintProperty(r.lyrAnim,"line-opacity",0);
}
function startAnim(id){
  stopAnim(id);
  const r=routeLayers[id]; if(!r) return;
  const DUR=5500; let t0=null;
  function frame(ts){
    if(!routeAnims[id]?.active) return;
    if(!t0) t0=ts;
    const prog=((ts-t0)%DUR)/DUR, dist=prog*r.total, pts=[];
    for(let i=0;i<r.coords.length;i++){
      if(r.dists[i]<=dist){ pts.push(r.coords[i]); }
      else{
        if(pts.length>0&&i>0){
          const seg=r.dists[i]-r.dists[i-1],t=seg>0?(dist-r.dists[i-1])/seg:0;
          const p=r.coords[i-1],q=r.coords[i];
          pts.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])]);
        }
        break;
      }
    }
    if(pts.length>=2){ const src=map.getSource(r.srcAnim); if(src) src.setData({type:"Feature",geometry:{type:"LineString",coordinates:pts}}); }
    routeAnims[id].raf=requestAnimationFrame(frame);
  }
  routeAnims[id]={active:true,raf:requestAnimationFrame(frame)};
}
function stopAnim(id){
  if(routeAnims[id]){ routeAnims[id].active=false; cancelAnimationFrame(routeAnims[id].raf); delete routeAnims[id]; }
  const r=routeLayers[id];
  if(r){ const src=map.getSource(r.srcAnim); if(src) src.setData({type:"Feature",geometry:{type:"LineString",coordinates:[]}}); }
}

window.closeLocked = function(evt){
  if(evt) evt.stopPropagation();
  if(lockedId!==null){
    hideRoute(lockedId);
    if(lockedPopups[lockedId]){ lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
    setMarkerColor(lockedId,RED);
    infoHiddenIds.delete(lockedId);
    if(markerEls[lockedId]) markerEls[lockedId].classList.remove("info-hidden");
    lockedId=null;
  }
};

function showHoverPopup(e){
  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
  setMarkerColor(e.id,BLUE); showRoute(e.id);
  hoverPopupObj=new mapboxgl.Popup({offset:22,closeButton:false,closeOnClick:false,anchor:"bottom"})
    .setLngLat([e.lng,e.lat]).setHTML(buildPopupHtml(e,false)).addTo(map);
}
function hideHoverPopup(id){
  if(lockedId===id) return;
  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
  hideRoute(id); setMarkerColor(id,RED);
}
function lockEthel(e){
  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
  if(lockedId!==null&&lockedId!==e.id){
    hideRoute(lockedId);
    if(lockedPopups[lockedId]){ lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
    setMarkerColor(lockedId,RED);
    infoHiddenIds.delete(lockedId);
    if(markerEls[lockedId]) markerEls[lockedId].classList.remove("info-hidden");
  }
  if(lockedId===e.id && !infoHiddenIds.has(e.id)){ closeLocked(); return; }
  lockedId=e.id; setMarkerColor(e.id,BLUE); showRoute(e.id);
  map.panTo([e.lng,e.lat],{duration:300});
  const p=new mapboxgl.Popup({offset:22,closeButton:false,closeOnClick:false,anchor:"bottom"})
    .setLngLat([e.lng,e.lat]).setHTML(buildPopupHtml(e,true)).addTo(map);
  lockedPopups[e.id]=p;
}

    const el=document.createElement("div");
    el.className="marker";
    el.innerHTML=`<svg width="27" height="41" viewBox="0 0 27 41" xmlns="http://www.w3.org/2000/svg"><path d="M13.5 0C6.044 0 0 6.044 0 13.5c0 9.375 13.5 27.5 13.5 27.5S27 22.875 27 13.5C27 6.044 20.956 0 13.5 0z" fill="${RED}"/><circle cx="13.5" cy="13.5" r="5" fill="white" opacity="0.9"/></svg><div class="marker-eye-overlay"><div class="eye-overlay-btn" style="position:absolute;top:-11px;left:-11px;width:22px;height:22px;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg></div></div>`;
    el.dataset.ethelId = e.id;
    markerEls[e.id]=el;
    new mapboxgl.Marker({element:el}).setLngLat([e.lng,e.lat]).addTo(map);

    if(!isMobile){
      el.addEventListener("mouseenter",()=>{ if(lockedId!==e.id&&!infoHiddenIds.has(e.id)) showHoverPopup(e); });
      el.addEventListener("mouseleave",()=>{ if(lockedId!==e.id&&!infoHiddenIds.has(e.id)) hideHoverPopup(e.id); });
      el.addEventListener("click",evt=>{
        evt.stopPropagation();
        if(infoHiddenIds.has(e.id)){ toggleInfo(e.id, evt); return; }
        lockEthel(e);
      });
    } else {
      el.addEventListener("click",evt=>{
        evt.stopPropagation();
        if(infoHiddenIds.has(e.id)){ toggleInfo(e.id, evt); return; }
        lockEthel(e);
      });
    }
  });
  map.on("click",()=>{ if(!isMobile) closeLocked(); });
  const mob=window.innerWidth<600;
  map.fitBounds(bounds,{padding:mob?30:80,maxZoom:11});

  // Load GPX routes in parallel
  (async()=>{
    await Promise.all(ETHELS.map(async e=>{
      try{ const line=await loadGpx(e.gpx); if(line) addRoute(e,line); }catch(_){}
    }));
  })();
});


const infoHiddenIds = new Set();

window.toggleInfo = function(id, evt) {
  if(evt) evt.stopPropagation();
  const el = markerEls[id];

  // Restore if hidden
  if(infoHiddenIds.has(id)){
    infoHiddenIds.delete(id);
    const popup = lockedPopups[id];
    if(popup){
      popup.getElement().style.opacity = "1";
      popup.getElement().style.pointerEvents = "auto";
    }
    if(el) el.classList.remove("info-hidden");
    return;
  }

  // Lock first if not already locked (converts hover popup to locked)
  const ethel = ETHELS.find(e=>e.id===id);
  if(!ethel) return;
  if(!lockedPopups[id]){
    // Remove hover popup silently before locking
    if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
    // Create locked popup
    if(lockedId!==null && lockedId!==id){
      hideRoute(lockedId);
      if(lockedPopups[lockedId]){ lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
      setMarkerColor(lockedId,RED);
      infoHiddenIds.delete(lockedId);
      if(markerEls[lockedId]) markerEls[lockedId].classList.remove("info-hidden");
    }
    lockedId = id;
    const p = new mapboxgl.Popup({offset:22,closeButton:false,closeOnClick:false,anchor:"bottom"})
      .setLngLat([ethel.lng,ethel.lat]).setHTML(buildPopupHtml(ethel,true)).addTo(map);
    lockedPopups[id] = p;
  }

  // Now hide
  const popup = lockedPopups[id];
  if(!popup) return;
  infoHiddenIds.add(id);
  popup.getElement().style.opacity = "0";
  popup.getElement().style.pointerEvents = "none";
  if(el) el.classList.add("info-hidden");
};



// ===== FLYOVER ENGINE =====
let flyoverActive = false;
let flyoverPlaying = true;
let flyoverAnimId = null;
let flyoverProgress = 0;
let flyoverCamCenter = null;
let flyoverCamBearing = null;
let flyoverCurrentZoom = 15.7;
let flyoverTargetZoom  = 15.7;
let flyoverLastTs = 0;
let flyoverEthelId = null;
let flyoverSavedState = null;
let flyoverCamMode = "follow";
let flyoverUserOverride = false;
let flyoverLockedEthelId = null;
const FV_START_ZOOM = 15.7;
const FV_SMOOTH     = 0.13;
const FV_MAX_TURN   = 7;
const FV_STEP_KM    = 0.02;

function buildFlyoverRoute(coords) {
  const line = {type:"Feature",geometry:{type:"LineString",coordinates:coords}};
  const len  = turf.length(line,{units:"kilometers"});
  const pts  = [];
  for (let d=0; d<=len; d+=FV_STEP_KM)
    pts.push(turf.along(line,Math.min(d,len),{units:"kilometers"}).geometry.coordinates);
  return {pts, len};
}

window.startFlyover = function(id, evt) {
  if (evt) evt.stopPropagation();
  const r = routeLayers[id];
  if (!r || !r.coords || r.coords.length < 2) {
    const flyBtns = document.querySelectorAll(`.fly-btn`);
    flyBtns.forEach(b => { if (b.getAttribute("onclick")?.includes(`'${id}'`)) b.style.opacity = "0.4"; });
    const poll = setInterval(() => {
      const rr = routeLayers[id];
      if (rr && rr.coords && rr.coords.length >= 2) {
        clearInterval(poll);
        flyBtns.forEach(b => { b.style.opacity = ""; });
        window.startFlyover(id, null);
      }
    }, 200);
    return;
  }
  stopAnim(id);
  if (r.lyrAnim && map.getLayer(r.lyrAnim)) map.setPaintProperty(r.lyrAnim,"line-opacity",0);
  flyoverSavedState = { center:map.getCenter(), zoom:map.getZoom(), bearing:map.getBearing(), pitch:map.getPitch() };
  flyoverEthelId  = id;
  flyoverActive   = true;
  flyoverPlaying  = true;
  flyoverProgress = 0;
  flyoverCamCenter  = null;
  flyoverCamBearing = null;
  flyoverCurrentZoom = FV_START_ZOOM;
  flyoverTargetZoom  = FV_START_ZOOM;
  flyoverLastTs = 0;
  flyoverCamMode = "follow";
  flyoverUserOverride = false;
  flyoverLockedEthelId = lockedId; // save so we can restore on exit
  const {pts, len} = buildFlyoverRoute(r.coords);
  r._flyPts = pts;
  r._flyLen = len;
  if (!map.getSource("mapbox-dem")) {
    map.addSource("mapbox-dem",{type:"raster-dem",url:"mapbox://mapbox.mapbox-terrain-dem-v1"});
  }
  map.setTerrain({source:"mapbox-dem",exaggeration:1});
  if (!map.getLayer("sky-flyover"))
    map.addLayer({id:"sky-flyover",type:"sky",paint:{"sky-type":"atmosphere","sky-atmosphere-sun-intensity":12}});

  // Flyover-specific route line (thicker)
  const fullLine = {type:"Feature",geometry:{type:"LineString",coordinates:pts}};
  if (!map.getSource("fv-route-src")) {
    map.addSource("fv-route-src",{type:"geojson",data:fullLine});
  } else {
    map.getSource("fv-route-src").setData(fullLine);
  }
  if (!map.getLayer("fv-route-line")) {
    map.addLayer({id:"fv-route-line",type:"line",source:"fv-route-src",
      layout:{"line-cap":"round","line-join":"round"},
      paint:{"line-color":RED,"line-width":5.5,"line-opacity":0.95}
    });
  }

  // Arrow image + layer (ensure image is ready before adding layer)
  const addArrowLayer = () => {
    if (!map.getLayer("fv-route-arrows")) {
      map.addLayer({id:"fv-route-arrows",type:"symbol",source:"fv-route-src",
        layout:{
          "symbol-placement":"line","symbol-spacing":110,
          "icon-image":"fv-arrow","icon-size":0.45,
          "icon-allow-overlap":true,"icon-ignore-placement":true,
          "icon-rotation-alignment":"map","icon-keep-upright":false
        },
        paint:{"icon-opacity":0.9}
      });
    }
  };
  if (map.hasImage("fv-arrow")) {
    addArrowLayer();
  } else {
    const c2 = document.createElement("canvas");
    c2.width = c2.height = 96;
    const ctx2 = c2.getContext("2d");
    ctx2.translate(48,48);
    ctx2.beginPath(); ctx2.moveTo(40,0); ctx2.lineTo(-24,-25); ctx2.lineTo(-24,25); ctx2.closePath();
    ctx2.strokeStyle = RED; ctx2.fillStyle = "#fff"; ctx2.lineWidth = 3;
    ctx2.stroke(); ctx2.fill();
    createImageBitmap(c2).then(bmp => { map.addImage("fv-arrow", bmp, {pixelRatio:2}); addArrowLayer(); });
  }

  // Cursor dot
  if (!map.getSource("fv-cursor-src")) {
    map.addSource("fv-cursor-src",{type:"geojson",data:turf.point(pts[0])});
  } else {
    map.getSource("fv-cursor-src").setData(turf.point(pts[0]));
  }
  if (!map.getLayer("fv-cursor")) {
    map.addLayer({id:"fv-cursor",type:"circle",source:"fv-cursor-src",
      paint:{"circle-radius":6,"circle-color":"#fff","circle-stroke-width":3,"circle-stroke-color":RED}
    });
  }

  if (hoverPopupObj) { hoverPopupObj.remove(); hoverPopupObj=null; }
  Object.keys(lockedPopups).forEach(k => { lockedPopups[k].remove(); delete lockedPopups[k]; });
  lockedId = null;
  document.getElementById("search-container").style.display = "none";
  document.getElementById("map-btn-fullscreen").style.display = "none";
  document.getElementById("fvIconPlay").classList.remove("active");
  document.getElementById("fvIconPause").classList.add("active");
  document.getElementById("fvIconCamFollow").classList.add("active");
  document.getElementById("fvIconCamBird").classList.remove("active");
  document.getElementById("fvIconCamFree").classList.remove("active");
  document.getElementById("fvBtnCam").classList.remove("fv-free");
  document.getElementById("flyover-overlay").classList.add("active");
  ["mousedown","touchstart","dragstart","rotatestart","zoomstart","pitchstart"].forEach(ev=>{
    map.off(ev, onFlyoverInteract);
    map.on(ev, onFlyoverInteract);
  });
  if (flyoverAnimId) cancelAnimationFrame(flyoverAnimId);
  flyoverAnimId = requestAnimationFrame(flyoverTick);
};

function flyoverTick(ts) {
  if (!flyoverActive) return;
  if (!flyoverLastTs) flyoverLastTs = ts;
  const dt = Math.min((ts - flyoverLastTs)/1000, 0.05);
  flyoverLastTs = ts;
  const r = routeLayers[flyoverEthelId];
  if (!r || !r._flyPts) return;
  if (flyoverPlaying) {
    const speed = parseFloat(document.getElementById("fvSpeed").value || "0.35");
    flyoverProgress += speed * dt * 0.28;
    if (flyoverProgress > r._flyLen) {
      flyoverProgress = 0;
      flyoverCamCenter = null;
      flyoverCamBearing = null;
    }
  }
  const flyLine = {type:"Feature",geometry:{type:"LineString",coordinates:r._flyPts}};
  const pos = turf.along(flyLine, flyoverProgress, {units:"kilometers"}).geometry.coordinates;
  const nxt = turf.along(flyLine, Math.min(flyoverProgress+0.01, r._flyLen), {units:"kilometers"}).geometry.coordinates;
  const cursorSrc = map.getSource("fv-cursor-src");
  if (cursorSrc) cursorSrc.setData(turf.point(pos));
  if (!flyoverUserOverride) {
    const targetBearing = turf.bearing(turf.point(pos), turf.point(nxt));
    if (flyoverCamBearing === null) flyoverCamBearing = targetBearing;
    const diff = ((targetBearing - flyoverCamBearing + 540) % 360) - 180;
    flyoverCamBearing += Math.max(-FV_MAX_TURN*dt, Math.min(FV_MAX_TURN*dt, diff));
    if (!flyoverCamCenter) flyoverCamCenter = pos;
    flyoverCamCenter = [
      flyoverCamCenter[0] + (pos[0]-flyoverCamCenter[0]) * FV_SMOOTH,
      flyoverCamCenter[1] + (pos[1]-flyoverCamCenter[1]) * FV_SMOOTH
    ];
    const dz = flyoverTargetZoom - flyoverCurrentZoom;
    flyoverCurrentZoom += dz * Math.min(1, 3*dt);
    map.jumpTo({ center:flyoverCamCenter, bearing:flyoverCamBearing, pitch:flyoverCamMode==="topdown"?0:75, zoom:flyoverCurrentZoom });
  }
  flyoverAnimId = requestAnimationFrame(flyoverTick);
}

function setFlyoverCamBtn() {
  const btn = document.getElementById("fvBtnCam");
  if (flyoverUserOverride) {
    btn.classList.add("fv-free");
    document.getElementById("fvIconCamFollow").classList.remove("active");
    document.getElementById("fvIconCamBird").classList.remove("active");
    document.getElementById("fvIconCamFree").classList.add("active");
  } else {
    btn.classList.remove("fv-free");
    document.getElementById("fvIconCamFree").classList.remove("active");
    document.getElementById("fvIconCamFollow").classList.toggle("active", flyoverCamMode === "follow");
    document.getElementById("fvIconCamBird").classList.toggle("active", flyoverCamMode === "topdown");
  }
}

function onFlyoverInteract(e) {
  if (!e.originalEvent) return;
  if (flyoverActive && !flyoverUserOverride) {
    flyoverUserOverride = true;
    setFlyoverCamBtn();
  }
}

function stopFlyover() {
  const restoredId = flyoverEthelId;
  flyoverActive = false;
  if (flyoverAnimId) { cancelAnimationFrame(flyoverAnimId); flyoverAnimId = null; }
  document.getElementById("flyover-overlay").classList.remove("active");
  document.getElementById("search-container").style.display = "";
  document.getElementById("map-btn-fullscreen").style.display = "";
  ["mousedown","touchstart","dragstart","rotatestart","zoomstart","pitchstart"].forEach(ev => {
    map.off(ev, onFlyoverInteract);
  });
  ["fv-cursor","fv-route-arrows","fv-route-line"].forEach(l => { if (map.getLayer(l)) map.removeLayer(l); });
  ["fv-cursor-src","fv-route-src"].forEach(s => { if (map.getSource(s)) map.removeSource(s); });
  if (map.getLayer("sky-flyover")) map.removeLayer("sky-flyover");
  if (map.getLayer("fv-arrows")) map.removeLayer("fv-arrows");
  if (map.getSource("fv-arrow-src")) map.removeSource("fv-arrow-src");
  if (map.getLayer("fv-cursor")) map.removeLayer("fv-cursor");
  if (map.getSource("fv-cursor")) map.removeSource("fv-cursor");
  try { map.setTerrain(null); } catch(e) {}
  if (flyoverSavedState) {
    map.easeTo({ center:flyoverSavedState.center, zoom:flyoverSavedState.zoom, bearing:flyoverSavedState.bearing, pitch:flyoverSavedState.pitch, duration:1200 });
    flyoverSavedState = null;
  }
  flyoverEthelId = null;
  flyoverUserOverride = false;
  document.getElementById("fvSpeedWrap").classList.remove("open");

  // Restore the popup and route animation for the ethel that was locked before flyover
  if (flyoverLockedEthelId) {
    const ethel = ETHELS.find(e => e.id === flyoverLockedEthelId);
    if (ethel) {
      setTimeout(() => {
        setMarkerColor(ethel.id, BLUE);
        showRoute(ethel.id);
        const p = new mapboxgl.Popup({offset:22, closeButton:false, closeOnClick:false, anchor:"bottom"})
          .setLngLat([ethel.lng, ethel.lat])
          .setHTML(buildPopupHtml(ethel, true))
          .addTo(map);
        lockedPopups[ethel.id] = p;
        lockedId = ethel.id;
      }, 1300); // after easeTo completes
    }
    flyoverLockedEthelId = null;
  }
}

document.getElementById("fvBtnToggle").onclick = () => {
  flyoverPlaying = !flyoverPlaying;
  document.getElementById("fvIconPlay").classList.toggle("active", !flyoverPlaying);
  document.getElementById("fvIconPause").classList.toggle("active", flyoverPlaying);
};
document.getElementById("fvBtnRestart").onclick = () => {
  flyoverProgress = 0;
  flyoverUserOverride = false;
  flyoverCamCenter = null; flyoverCamBearing = null;
  flyoverCurrentZoom = FV_START_ZOOM; flyoverTargetZoom = FV_START_ZOOM;
  setFlyoverCamBtn();
};
document.getElementById("fvBtnReturn").onclick = stopFlyover;
document.getElementById("fvBtnCam").onclick = () => {
  if (flyoverUserOverride) {
    flyoverUserOverride = false;
    flyoverCamCenter = null; flyoverCamBearing = null;
    setFlyoverCamBtn();
  } else {
    flyoverCamMode = (flyoverCamMode === "follow") ? "topdown" : "follow";
    flyoverCamCenter = null; flyoverCamBearing = null;
    setFlyoverCamBtn();
  }
};
document.getElementById("fvBtnZoomIn").onclick = () => { flyoverTargetZoom = Math.min(flyoverTargetZoom + 0.7, 19); };
document.getElementById("fvBtnZoomOut").onclick = () => { flyoverTargetZoom = Math.max(flyoverTargetZoom - 0.7, 4); };
document.getElementById("fvBtnSpeed").onclick = e => {
  e.stopPropagation();
  document.getElementById("fvSpeedWrap").classList.toggle("open");
};
document.addEventListener("click", () => {
  const sw = document.getElementById("fvSpeedWrap");
  if (sw) sw.classList.remove("open");
});

// Shared fullscreen logic
function isAndroid(){ return /Android/i.test(navigator.userAgent||""); }
function isFS(){ return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement); }
function fsToggle(){
  if(!isFS()){
    const el=document.getElementById("map");
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if(el.mozRequestFullScreen) el.mozRequestFullScreen();
  } else {
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}
function updateFsIcons(){
  const inFS = isFS();
  document.getElementById("fsIconExpand").style.display = inFS?"none":"block";
  document.getElementById("fsIconCollapse").style.display = inFS?"block":"none";
  document.getElementById("fvFsIconExpand").style.display = inFS?"none":"block";
  document.getElementById("fvFsIconCollapse").style.display = inFS?"block":"none";
}
document.addEventListener("fullscreenchange", updateFsIcons);
document.addEventListener("webkitfullscreenchange", updateFsIcons);

(function(){
  const iosParams = new URLSearchParams(location.search);
  const iosFS = isIOS() && iosParams.get("fs")==="1";
  function openInNew(){ const url=new URL(location.href); url.searchParams.set("fs","1"); window.open(url.toString(),"_blank"); }

  const mapBtn = document.getElementById("map-btn-fullscreen");
  const fvBtn  = document.getElementById("fv-btn-fullscreen");

  if(isIOS()){
    if(iosFS){ mapBtn.style.display="none"; if(fvBtn) fvBtn.style.display="none"; }
    else { mapBtn.onclick = openInNew; if(fvBtn) fvBtn.onclick = openInNew; }
  } else if(isAndroid()){
    // Android WebView / Safari can't fullscreen a child element reliably — open in new tab instead
    mapBtn.onclick = openInNew;
    if(fvBtn) fvBtn.onclick = openInNew;
  } else {
    mapBtn.onclick = fsToggle;
    if(fvBtn) fvBtn.onclick = fsToggle;
  }
})();

const searchInput=document.getElementById("search-input");
const searchResults=document.getElementById("search-results");
searchInput.addEventListener("input",()=>{
  const q=searchInput.value.trim().toLowerCase();
  if(!q){ searchResults.classList.remove("visible"); return; }
  const hits=ETHELS.filter(e=>e.displayName.toLowerCase().includes(q)||e.name.toLowerCase().includes(q)).slice(0,9);
  if(!hits.length){ searchResults.innerHTML=`<div class="search-no-results">No results for "${q}"</div>`; searchResults.classList.add("visible"); return; }
  searchResults.innerHTML=hits.map(e=>`<div class="search-item" data-id="${e.id}"><span>${e.displayName}</span><span class="search-item-height">${e.height}m</span></div>`).join("");
  searchResults.classList.add("visible");
});
searchResults.addEventListener("click",evt=>{
  const item=evt.target.closest(".search-item"); if(!item) return;
  const e=ETHELS.find(x=>x.id===item.dataset.id); if(!e) return;
  searchInput.value=""; searchResults.classList.remove("visible");
  map.flyTo({center:[e.lng,e.lat],zoom:14,duration:1000});
  setTimeout(()=>lockEthel(e),1050);
});
document.addEventListener("click",e=>{ if(!e.target.closest("#search-container")) searchResults.classList.remove("visible"); });
searchInput.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ searchResults.classList.remove("visible"); searchInput.blur(); }
  if(e.key==="Enter"){ const first=searchResults.querySelector(".search-item"); if(first) first.click(); }
});
</script>
